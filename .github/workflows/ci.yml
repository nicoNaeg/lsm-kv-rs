name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # --nocapture so the crash test's retention number reaches the log. It is
      # the only signal that test has for a lost tail, and a captured one would
      # let the run quietly stop proving anything.
      - run: cargo test --all-features -- --nocapture

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # A separate cache: this job builds the crate under a different cfg,
          # against a dependency the job above does not have.
          key: loom
      - run: make loom
